Listen 443

SSLCipherSuite HIGH:MEDIUM:!MD5:!RC4:!3DES
SSLProxyCipherSuite HIGH:MEDIUM:!MD5:!RC4:!3DES

SSLHonorCipherOrder on
SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
SSLProxyProtocol all -SSLv3 -TLSv1 -TLSv1.1

<VirtualHost *:443>
    ServerName missstarinternational.com
    ServerAlias www.missstarinternational.com
    DocumentRoot "C:/Program Files/Apache24/htdocs"
    
    SSLEngine on
    SSLCertificateFile "conf/ssl/missstarinternational.com.crt"
    SSLCertificateKeyFile "conf/ssl/missstarinternational.com.key"
    
    # Security Headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
    
    # Enable compression
    AddOutputFilterByType DEFLATE text/plain text/html text/xml text/css text/javascript application/xml application/xhtml+xml application/rss+xml application/javascript application/x-javascript application/json
    
    # Cache control
    <FilesMatch "\.(ico|pdf|flv|jpg|jpeg|png|gif|js|css|swf|webp)$">
        Header set Cache-Control "max-age=31536000, public"
    </FilesMatch>
    
    # Custom error pages
    ErrorDocument 404 /404.html
    ErrorDocument 500 /500.html
    
    <Directory "C:/Program Files/Apache24/htdocs">
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost> 