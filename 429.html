<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Too Many Requests - Miss Star International</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .error-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, #1a1a1a 0%, #000000 100%);
            color: #ffffff;
        }
        .error-code {
            font-size: 8rem;
            font-weight: bold;
            margin: 0;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .error-message {
            font-size: 2rem;
            margin: 1rem 0;
        }
        .error-description {
            font-size: 1.2rem;
            margin: 1rem 0;
            max-width: 600px;
        }
        .back-button {
            margin-top: 2rem;
            padding: 1rem 2rem;
            background: linear-gradient(45deg, #FFD700, #FFA500);
            border: none;
            border-radius: 50px;
            color: #000000;
            font-weight: bold;
            text-decoration: none;
            transition: transform 0.3s ease;
        }
        .back-button:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="error-container">
        <h1 class="error-code">429</h1>
        <h2 class="error-message">Too Many Requests</h2>
        <p class="error-description">We've detected too many requests from your IP address. Please wait a moment and try again later.</p>
        <a href="/" class="back-button">Return to Homepage</a>
    </div>
</body>
</html>
